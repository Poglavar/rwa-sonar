# rwasonar.com nginx site, installed as /etc/nginx/sites-available/rwasonar (symlinked into
# sites-enabled). Versioned here since 2026-09-23; apply by hand with deploy/nginx/apply.sh.
# CSS/JS: a URL with ?v=<stamp> never changes content (the stamp is bumped with the file), so it
# caches for a year; an unstamped reference is revalidated on every load.
map $arg_v $rwasonar_asset_cache {
    ""      "no-cache";
    default "public, max-age=31536000, immutable";
}

server {
    include snippets/deny-dotfiles.conf;
    server_name rwasonar.com www.rwasonar.com;

    root /var/www/rwasonar;
    index index.html;
    # Text responses (llms.txt, robots.txt, sitemaps, pages) say their encoding; llms.txt has UTF-8 prose.
    charset utf-8;
    charset_types text/plain text/xml application/xml application/json text/css application/javascript;
    include snippets/rwasonar-headers.conf;
    # One host for search engines and link previews: www answers with a permanent redirect to the
    # apex instead of serving a duplicate of every page (canonical tags already name the apex).
    if ($host = www.rwasonar.com) {
        return 301 https://rwasonar.com$request_uri;
    }
    # A real 404 for unknown paths (2026-09-23): the old /index.html fallback answered every bad
    # link with the landing page and a 200.
    error_page 404 /404.html;

    # Pages (and anything without a more specific rule below): the browser revalidates on every
    # load and gets a cheap 304 when nothing changed. Without a Cache-Control header the browser
    # guesses a lifetime from Last-Modified and can show a page from before the last deploy.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        include snippets/rwasonar-headers.conf;
    }
    location ~* \.(css|js|mjs)$ {
        try_files $uri =404;
        add_header Cache-Control $rwasonar_asset_cache;
        include snippets/rwasonar-headers.conf;
    }

    # Job-written data and the generated cards: short browser cache, and a real 404 for a
    # card or data file that does not exist instead of the homepage fallback above.
    # The read-only JSON API (PM2 app rwa-sonar-api, Hono on 127.0.0.1:3300, see api/README.md).
    location /api/ {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /cards/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        include snippets/rwasonar-headers.conf;
    }
    # Social preview images. A generated family's image is named by its content hash, so a name never
    # changes content; the hand-written pages' og/<page>.png is replaced in place and linked with
    # ?v=<hash>, so it gets an hour. Both are plain 200 image/png with no redirect, which is what X,
    # LinkedIn, Facebook, Telegram, Discord, WhatsApp, Bluesky and Mastodon preview fetchers need.
    location ~ ^/(cards|issuers|templates|protocols|weekly)/og/[^/]+\.png$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include snippets/rwasonar-headers.conf;
    }
    location ^~ /og/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
        include snippets/rwasonar-headers.conf;
    }
    # Site images (logos, dolphin art, icons) are replaced rarely and keep their names: one day.
    location ~* \.(png|jpe?g|webp|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
        include snippets/rwasonar-headers.conf;
    }
    location ~* \.json$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=60, stale-while-revalidate=300";
        include snippets/rwasonar-headers.conf;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/rwasonar.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/rwasonar.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot



}
server {
    include snippets/deny-dotfiles.conf;
    if ($host = www.rwasonar.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = rwasonar.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name rwasonar.com www.rwasonar.com;
    return 404; # managed by Certbot




}