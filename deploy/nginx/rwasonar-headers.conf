# Security headers for rwasonar.com, installed as /etc/nginx/snippets/rwasonar-headers.conf.
# Included in the server block AND in every location that sets its own add_header, because nginx
# drops inherited add_header directives in such a location.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Enforced since 2026-09-23 after a report-only sweep of every page (only Cloudflare's injected
# analytics beacon was missing). Scripts only from this origin, Microsoft Clarity and Cloudflare; no inline scripts anywhere (hosting.test.js
# enforces that). Inline styles stay allowed because rendered HTML sets widths and colours via
# style attributes. Images from any https host (token logos come from issuer and IPFS gateways).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.clarity.ms https://scripts.clarity.ms https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.clarity.ms https://c.bing.com https://cloudflareinsights.com https://solana-rpc.publicnode.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
