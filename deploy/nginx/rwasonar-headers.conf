# Security headers for rwasonar.com, installed as /etc/nginx/snippets/rwasonar-headers.conf.
# Included in the server block AND in every location that sets its own add_header, because nginx
# drops inherited add_header directives in such a location.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Scripts only from this origin and Microsoft Clarity; no inline scripts anywhere (hosting.test.js
# enforces that). Inline styles stay allowed because rendered HTML sets widths and colours via
# style attributes. Images from any https host (token logos come from issuer and IPFS gateways).
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://www.clarity.ms https://scripts.clarity.ms; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.clarity.ms https://c.bing.com https://solana-rpc.publicnode.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
