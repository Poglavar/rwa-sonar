<!doctype html>
<!-- Not-found page served by nginx for any unknown path, so a bad link reads as a 404 rather than
     silently returning the landing page with a 200 status. Self-contained: no scripts, inline-free. -->
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Not found — RWA Sonar</title>
    <link rel="icon" type="image/svg+xml" href="/images/variant3.svg" />
    <link rel="stylesheet" href="/404.css" />
</head>
<body>
    <main class="nf">
        <p class="nf-code">404</p>
        <h1>This page does not exist.</h1>
        <p>The link may be old, or the token or report may have a different address.</p>
        <nav class="nf-links">
            <a href="/">Home</a>
            <a href="/stocks.html">Explore tokenized stocks</a>
            <a href="/whatif.html">What if…</a>
            <a href="/watch.html">Changes</a>
            <a href="/pitch/">Pitch</a>
        </nav>
    </main>
</body>
</html>
