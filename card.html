<!-- A shim, not a page: /card.html?mint=… or ?symbol=… resolves the token against cards/index.json
     and replaces itself with cards/<slug>.html, so a card can be linked by mint or ticker without
     knowing its file name. The script is inline because the whole file is the redirect. -->
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stock card — RWA Sonar</title>
    <meta name="description" content="Open a tokenized-stock analysis card by token symbol or Solana mint." />
    <link rel="canonical" href="https://rwasonar.com/stocks.html" />
    <link rel="icon" type="image/svg+xml" href="./images/variant3.svg" />
    <script src="./theme.js?v=20260924y"></script>
    <link rel="stylesheet" href="app-shell.css?v=20260924y" />
    <link rel="stylesheet" href="card.css?v=20260924cm" />
</head>

<body>
    <main class="card">
        <h1>Stock card</h1>
        <p id="msg">JavaScript is off, so this redirect cannot run — open the stocks page below and
            follow its &ldquo;Card&nbsp;&#8599;&rdquo; link for the token you want.</p>
        <p><a href="stocks.html">All tokenized stocks</a></p>
    </main>
    <script src="card-redirect.js?v=20260923a"></script>
