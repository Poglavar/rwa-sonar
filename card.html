<!doctype html>
<!-- A shim, not a page: /card.html?mint=… or ?symbol=… resolves the token against cards/index.json
     and replaces itself with cards/<slug>.html, so a card can be linked by mint or ticker without
     knowing its file name. The script is inline because the whole file is the redirect. -->
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Stock card — RWA Sonar</title>
    <link rel="icon" type="image/svg+xml" href="./images/variant3.svg" />
    <link rel="stylesheet" href="card.css?v=20260917a" />
</head>

<body>
    <main class="card">
        <h1>Stock card</h1>
        <p id="msg">JavaScript is off, so this redirect cannot run — open the stocks page below and
            follow its &ldquo;Card&nbsp;&#8599;&rdquo; link for the token you want.</p>
        <p><a href="stocks.html">All tokenized stocks</a></p>
    </main>
    <script>
        (function () {
            var params = new URLSearchParams(location.search);
            var mint = (params.get('mint') || '').trim();
            var symbol = (params.get('symbol') || '').trim().toLowerCase();
            var msg = document.getElementById('msg');
            if (!mint && !symbol) {
                msg.textContent = 'Add ?mint=<address> or ?symbol=<ticker> to this URL.';
                return;
            }
            msg.textContent = 'Looking up ' + (mint || symbol) + '…';
            fetch('cards/index.json', { cache: 'no-store' }).then(function (res) {
                if (!res.ok) throw new Error('cards/index.json returned ' + res.status);
                return res.json();
            }).then(function (list) {
                var hit = null;
                for (var i = 0; i < list.length && hit === null; i += 1) {
                    if (mint && list[i].mint === mint) hit = list[i];
                    else if (symbol && String(list[i].symbol || '').toLowerCase() === symbol) hit = list[i];
                }
                if (hit === null) {
                    msg.textContent = 'No card for ' + (mint || symbol) + '.';
                    return;
                }
                location.replace('cards/' + encodeURIComponent(hit.slug) + '.html');
            }).catch(function (err) {
                msg.textContent = 'Could not read the card index: ' + err.message;
            });
        })();
    </script>
</body>

</html>
