<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonar Animation</title>
    <link rel="stylesheet" href="sonar-animation.css">
</head>
<body>
    <main class="sonar-container" aria-label="RWA Sonar animation">
        <div class="grid"></div>
        <div class="sonar-ring"></div>
        <div class="sonar-ring"></div>
        <div class="sonar-ring"></div>
        <div class="sonar-center">
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <circle class="sonar-outline" cx="50" cy="50" r="44" stroke-width="2" fill="none" />
                <path class="sonar-sweep" d="M50 50 L85 50 A35 35 0 0 0 50 15 Z" opacity="0.3" />
                <line class="sonar-axis" x1="50" y1="5" x2="50" y2="95" stroke-width="1" opacity="0.3" />
                <line class="sonar-axis" x1="5" y1="50" x2="95" y2="50" stroke-width="1" opacity="0.3" />
                <circle class="pink-dot" cx="70" cy="30" r="4" />
                <text class="sonar-label" x="48" y="70" text-anchor="end" font-family="Arial, sans-serif" font-size="8" font-weight="bold">RWA</text>
                <text class="sonar-label" x="52" y="70" text-anchor="start" font-family="Arial, sans-serif" font-size="8" font-weight="bold">sonar</text>
            </svg>
        </div>
        <p class="status" role="status">Scanning...</p>
    </main>
</body>
</html>
